version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sd-shopping-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/sd-shopping
      - JWT_SECRET=${JWT_SECRET:-production_secure_jwt_secret_change_me_12345}
      - GMAIL_USER=${GMAIL_USER:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sd_network

  mongo:
    image: mongo:7.0-jammy
    container_name: sd-shopping-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sd_network

  mongo-express:
    image: mongo-express:latest
    container_name: sd-shopping-mongo-ui
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=adminpass
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - sd_network
    profiles:
      - debug

volumes:
  mongo_data:
    driver: local

networks:
  sd_network:
    driver: bridge
